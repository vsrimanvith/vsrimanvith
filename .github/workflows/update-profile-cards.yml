name: Update profile cards

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_cards.py"
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup GitHub CLI
        run: |
          type -p gh >/dev/null || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Generate SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/*.svg
          if git diff --cached --quiet; then
            echo "No card changes"
            exit 0
          fi
          git commit -m "chore: refresh profile stats cards"
          git push
